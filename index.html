<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gay Murder Cruise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #333;
        }
        #game-container {
            position: relative;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #dialog-box {
            background: rgba(0, 0, 20, 0.92);
            border: 3px solid #fff;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            padding: 12px;
            margin: 8px;
            display: none;
            pointer-events: auto;
            image-rendering: pixelated;
        }
        #dialog-box.visible {
            display: block;
        }
        #prompt {
            position: absolute;
            bottom: 60px;
            width: 100%;
            text-align: center;
            color: #ffcc00;
            font-family: monospace;
            font-size: 12px;
            text-shadow: 1px 1px 0 #000;
            display: none;
        }
        #prompt.visible {
            display: block;
        }
        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: monospace;
            z-index: 10;
        }
        #title-screen h1 {
            font-size: 28px;
            color: #ff69b4;
            text-shadow: 2px 2px 0 #8b0000;
            margin-bottom: 8px;
        }
        #title-screen .subtitle {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 40px;
        }
        #title-screen .start-prompt {
            font-size: 14px;
            color: #ffcc00;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(139, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: monospace;
            z-index: 10;
        }
        #game-over.visible {
            display: flex;
        }
        #game-over h2 {
            font-size: 24px;
            margin-bottom: 16px;
        }
        #game-over p {
            font-size: 14px;
            color: #ffcc00;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="480" height="320"></canvas>
        <div id="ui-overlay">
            <div id="prompt">Press E to examine</div>
            <div id="dialog-box"></div>
        </div>
        <div id="title-screen">
            <h1>GAY MURDER CRUISE</h1>
            <div class="subtitle">Level 1 - Room 1: The Hallway</div>
            <div class="start-prompt">Press ENTER to start</div>
        </div>
        <div id="game-over">
            <h2>YOU'VE DISCOVERED A DEAD BODY!!</h2>
            <p>To be continued...</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
