<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gay Murder Cruise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 2px solid #333;
            max-width: 100vw;
            max-height: 60vh;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        #dialog-box {
            background: rgba(0, 0, 20, 0.92);
            border: 3px solid #fff;
            color: #fff;
            font-family: monospace;
            font-size: 14px;
            padding: 12px;
            margin: 8px;
            display: none;
            pointer-events: auto;
        }
        #dialog-box.visible {
            display: block;
        }
        #prompt {
            position: absolute;
            bottom: 60px;
            width: 100%;
            text-align: center;
            color: #ffcc00;
            font-family: monospace;
            font-size: 12px;
            text-shadow: 1px 1px 0 #000;
            display: none;
        }
        #prompt.visible {
            display: block;
        }
        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: monospace;
            z-index: 10;
        }
        #title-screen h1 {
            font-size: 28px;
            color: #ff69b4;
            text-shadow: 2px 2px 0 #8b0000;
            margin-bottom: 8px;
            text-align: center;
            padding: 0 10px;
        }
        #title-screen .subtitle {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 40px;
        }
        #title-screen .start-prompt {
            font-size: 14px;
            color: #ffcc00;
            animation: blink 1s infinite;
            cursor: pointer;
            padding: 20px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            color: #fff;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
        #game-over.visible {
            display: flex;
        }
        #game-over .go-text {
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 20px;
            margin-bottom: 20px;
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
            border: 2px solid #8b0000;
        }
        #game-over h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ff4444;
        }
        #game-over p {
            font-size: 12px;
            color: #ffcc00;
        }

        /* Mobile controls */
        #mobile-controls {
            display: none;
            width: 100%;
            max-width: 480px;
            padding: 10px 20px;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .dpad {
            position: relative;
            width: 120px;
            height: 120px;
        }
        .dpad-btn {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: rgba(255, 105, 180, 0.5);
            border-color: #ff69b4;
        }
        .dpad-up { left: 40px; top: 0; }
        .dpad-down { left: 40px; bottom: 0; }
        .dpad-left { left: 0; top: 40px; }
        .dpad-right { right: 0; top: 40px; }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 204, 0, 0.2);
            border: 2px solid rgba(255, 204, 0, 0.6);
            color: #ffcc00;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .action-btn:active, .action-btn.active {
            background: rgba(255, 204, 0, 0.5);
        }

        #music-toggle {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-family: monospace;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 20;
        }
        #music-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Chat panel */
        #chat-panel {
            background: #1a1420;
            border: 3px solid #ff69b4;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
        }
        #chat-portrait {
            border: 3px solid #ff69b4;
            box-shadow: 0 0 10px rgba(255,105,180,0.4);
        }
        #chat-messages .msg-npc {
            color: #e8d070;
            font-size: 12px;
            line-height: 18px;
            margin-bottom: 6px;
            word-break: break-word;
        }
        #chat-messages .msg-player {
            color: #70e870;
            font-size: 12px;
            line-height: 18px;
            margin-bottom: 6px;
            word-break: break-word;
        }

        @media (pointer: coarse), (max-width: 768px) {
            #mobile-controls {
                display: flex;
            }
            canvas {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game" width="480" height="320"></canvas>
        <div id="ui-overlay">
            <div id="prompt">Press E to examine</div>
            <div id="dialog-box"></div>
        </div>
        <div id="title-screen">
            <h1>GAY MURDER CRUISE</h1>
            <div class="subtitle">A Mystery at Sea</div>
            <div class="start-prompt" id="start-btn">Tap to start</div>
            <div style="position:absolute; bottom:12px; right:14px; font-size:10px; color:#555;">v0.14.3</div>
        </div>
        <div id="level-select" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:#000; flex-direction:column; justify-content:center; align-items:center; color:#fff; font-family:monospace; z-index:10;">
            <h2 style="color:#ff69b4; font-size:20px; margin-bottom:30px; text-shadow:2px 2px 0 #8b0000;">SELECT LEVEL</h2>
            <button onclick="selectLevel(0)" style="display:block; width:200px; margin-bottom:12px; padding:14px 20px; font-family:monospace; font-size:14px; cursor:pointer; background:rgba(255,204,0,0.15); border:2px solid #ffcc00; border-radius:6px; color:#ffcc00;">Level 0: Boarding</button>
            <button onclick="selectLevel(1)" style="display:block; width:200px; margin-bottom:12px; padding:14px 20px; font-family:monospace; font-size:14px; cursor:pointer; background:rgba(255,105,180,0.15); border:2px solid #ff69b4; border-radius:6px; color:#ff69b4;">Level 1: The Hallway</button>
            <button onclick="selectLevel(2)" style="display:block; width:200px; margin-bottom:12px; padding:14px 20px; font-family:monospace; font-size:14px; cursor:pointer; background:rgba(204,68,255,0.15); border:2px solid #cc44ff; border-radius:6px; color:#cc44ff;">Level 2: The Mystery</button>
            <button onclick="selectLevel(3)" style="display:block; width:200px; padding:14px 20px; font-family:monospace; font-size:14px; cursor:pointer; background:rgba(68,136,204,0.15); border:2px solid #4488cc; border-radius:6px; color:#4488cc;">Level 3: Blue Purse</button>
        </div>
        <div id="game-over">
            <div class="go-text" id="restart-btn">
                <h2 id="go-title">YOU DIED</h2>
                <p id="go-subtitle">The murderer got you... (tap to restart)</p>
            </div>
        </div>
        <button id="music-toggle">Music: ON</button>
    </div>

    <!-- Level 2 Chat UI -->
    <div id="chat-panel" style="display:none; width:480px; max-width:100vw; margin-top:6px;">
        <div id="chat-portrait-wrap" style="display:flex; justify-content:center; margin-bottom:8px;">
            <canvas id="chat-portrait" width="96" height="96" style="image-rendering:pixelated; border-radius:4px;"></canvas>
        </div>
        <div id="chat-npc-name" style="text-align:center; font-family:monospace; font-size:12px; margin-bottom:8px;"></div>
        <div id="chat-messages" style="max-height:140px; overflow-y:auto; margin-bottom:8px; padding:0 8px;"></div>
        <button id="chat-next" style="width:calc(100% - 16px); margin:0 8px; background:rgba(232,208,112,0.15); border:2px solid #e8d070; border-radius:4px; color:#e8d070; font-family:monospace; font-size:12px; padding:8px; cursor:pointer;">NEXT</button>
    </div>

    <!-- Notebook -->
    <div id="notebook-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.92); z-index:200; overflow-y:auto; padding:20px;">
        <div id="notebook-content" style="background:#1a1420; border:3px solid #e8d070; border-radius:8px; padding:16px; max-width:500px; width:100%; margin:0 auto; font-family:monospace;"></div>
    </div>
    <button id="notebook-btn" style="display:none; position:fixed; bottom:10px; left:10px; z-index:100; width:40px; height:40px; background:#1a1420; border:2px solid #e8d070; border-radius:6px; cursor:pointer; font-size:20px; padding:0;">📓</button>

    <div id="mobile-controls">
        <div class="dpad">
            <div class="dpad-btn dpad-up" data-dir="up">^</div>
            <div class="dpad-btn dpad-down" data-dir="down">v</div>
            <div class="dpad-btn dpad-left" data-dir="left">&lt;</div>
            <div class="dpad-btn dpad-right" data-dir="right">&gt;</div>
        </div>
        <div class="action-buttons">
            <div class="action-btn" id="btn-examine">LOOK</div>
        </div>
    </div>

    <script src="music.js"></script>
    <script src="game.js"></script>
</body>
</html>
